<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Home - Sistema TV Box</title>
    <link rel="stylesheet" href="/css/bootstrap-4.0.0-dist/css/bootstrap.min.css">
    <style>
        /* Reset para tags HTML5 em navegadores antigos (Firefox 3.0/IE8) */
        header, nav, main, footer, section { display: block; }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden; /* Evita barra de rolagem horizontal ao abrir menu */
            background-image: url('/midias/img/homen-predio.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover; /* Ignorado por navegadores muito antigos, mas melhora visual nos novos */
        }

        /* Conteúdo Principal */
        #main {
            padding: 20px;
            margin-left: 0;
        }

        .texto-destaque {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
            color: #ffffff;
            text-shadow: 2px 2px 4px #000000; /* Sombra para garantir leitura sobre qualquer imagem */
        }

        /* Cards do Menu */
        .menu-card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 30px 15px;
            text-align: center;
            margin-bottom: 20px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #ddd;
        }
        .menu-card:hover {
            transform: scale(1.03);
            background-color: #fff;
            text-decoration: none;
            cursor: pointer;
        }
        .menu-card h4 {
            color: #333;
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .menu-icon {
            font-size: 48px;
            color: #007bff;
            line-height: 1;
        }
        a.card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Conteúdo Principal -->
    <main id="main" class="container">
        <div class="texto-destaque">
            <h1>Sistema de Gerenciamento TV Box</h1>
            <h2>Controle de Estoque e Escalas</h2>
        </div>

        <div class="row justify-content-center">
            <!-- Card 2: Nova Retirada -->
            <div class="col-md-4 col-sm-6 mb-4">
                <a href="/page/nova_retirada" class="card-link">
                    <div class="menu-card">
                        <div class="menu-icon">&#128722;</div>
                        <h4>Registrar Retirada</h4>
                    </div>
                </a>
            </div>

            <!-- Card 3: Listar Funcionários -->
            <div class="col-md-4 col-sm-6 mb-4">
                <a href="/page/lista_funcionarios" class="card-link">
                    <div class="menu-card">
                        <div class="menu-icon">&#128196;</div>
                        <h4>Histórico & Lista</h4>
                    </div>
                </a>
            </div>

            <!-- Card 4: Escala -->
            <div class="col-md-4 col-sm-6 mb-4">
                <a href="/page/cria_escala" class="card-link">
                    <div class="menu-card">
                        <div class="menu-icon">&#128197;</div>
                        <h4>Gerenciar Escala</h4>
                    </div>
                </a>
            </div>

            <!-- Card 6: Configurar -->
            <div class="col-md-4 col-sm-6 mb-4">
                <a href="/page/configurar" class="card-link">
                    <div class="menu-card">
                        <div class="menu-icon">&#9881;</div>
                        <h4>Configurar Programa</h4>
                    </div>
                </a>
            </div>
        </div>
    </main>

</body>
</html>
